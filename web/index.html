<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Office</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2316121f'/%3E%3Crect x='4' y='3' width='8' height='7' fill='%23f1c27d'/%3E%3Crect x='4' y='3' width='8' height='3' fill='%234a2f1b'/%3E%3Crect x='4' y='10' width='8' height='4' fill='%233b5bdb'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #100d18;
        --panel: #1a1626;
        --panel-2: #231e33;
        --panel-3: #2c2541;
        --line: #342c4a;
        --line-hi: #4a3f66;
        --text: #e9e4ff;
        --muted: #8f86ad;
        --accent: #ffd43b;
        --font: "Pixelify Sans", ui-monospace, monospace;
        --px: 0 0 0 2px var(--line), 3px 3px 0 0 #0a0810;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 var(--font); }
      body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
      img { image-rendering: pixelated; }
      header {
        display: flex; align-items: center; gap: 14px; padding: 8px 14px;
        background: linear-gradient(#211b31, var(--panel)); border-bottom: 2px solid var(--line); min-width: 0;
      }
      h1 { font-size: 19px; margin: 0; white-space: nowrap; letter-spacing: 1px; text-shadow: 2px 2px 0 #0a0810; }
      h1 span { color: var(--accent); }
      #rooms { display: flex; gap: 8px; overflow-x: auto; flex: 1; min-width: 0; padding: 4px 4px 6px; scrollbar-width: thin; }
      .tab {
        display: flex; align-items: center; gap: 7px; max-width: 280px; flex: none;
        background: var(--panel-2); color: var(--text); border: 0; box-shadow: var(--px);
        padding: 5px 10px; font: inherit; cursor: pointer; border-radius: 0;
      }
      .tab:hover { background: var(--panel-3); }
      .tab.active { box-shadow: 0 0 0 2px var(--accent), 3px 3px 0 0 #0a0810; }
      .tab .dot { width: 8px; height: 8px; background: #868e96; flex: none; }
      .tab.busy .dot { background: #51cf66; animation: blink 1.2s steps(2) infinite; }
      .tab .proj { color: var(--muted); white-space: nowrap; }
      .tab .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab .count { background: #0f0c17; color: var(--muted); padding: 0 5px; font-size: 12px; }
      .opts { display: flex; gap: 12px; align-items: center; white-space: nowrap; color: var(--muted); }
      .opts label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
      .opts input { accent-color: var(--accent); }
      .conn { width: 10px; height: 10px; background: #868e96; flex: none; box-shadow: 0 0 0 2px #0a0810; }
      .conn.ok { background: #51cf66; }
      .conn.bad { background: #ff6b6b; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
      #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at center, #1a1527 0%, var(--bg) 70%); }
      #office { position: absolute; inset: 0; image-rendering: pixelated; }
      aside { background: var(--panel); border-left: 2px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
      #agents { max-height: 42vh; overflow-y: auto; border-bottom: 2px solid var(--line); padding: 4px 0 8px; }
      .list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 14px 6px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 13px; }
      .muted-inline { color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 12px; }
      .agent {
        position: relative; display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
        background: none; border: 0; color: var(--text); font: inherit; cursor: pointer;
        padding: 5px 12px 5px calc(12px + var(--depth, 0) * 18px);
      }
      .agent:hover { background: var(--panel-2); }
      .agent.sel { background: var(--panel-3); box-shadow: inset 3px 0 0 var(--accent); }
      .agent.done { opacity: 0.5; }
      .branch { position: absolute; left: calc(var(--depth, 0) * 18px - 2px); top: 0; bottom: 50%; width: 10px; border-left: 2px solid var(--line-hi); border-bottom: 2px solid var(--line-hi); }
      .avatar { width: 32px; height: 30px; flex: none; background: #0f0c17; box-shadow: 0 0 0 2px var(--line); }
      .avatar.big { width: 48px; height: 45px; }
      .agent .main { display: grid; gap: 1px; min-width: 0; flex: 1; }
      .agent .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .agent .name { font-weight: 600; }
      .role { color: var(--muted); font-size: 12px; }
      .pill { margin-left: auto; font-size: 11px; padding: 0 6px; color: var(--c); box-shadow: 0 0 0 1px var(--c); white-space: nowrap; }
      .agent .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
      .ico { width: 16px; height: 16px; flex: none; vertical-align: middle; }
      #detail { overflow-y: auto; padding: 12px 14px 24px; min-height: 0; }
      .hint { display: flex; gap: 8px; align-items: center; color: var(--muted); }
      .d-head { display: flex; align-items: center; gap: 12px; }
      .d-names { display: grid; gap: 2px; min-width: 0; flex: 1; }
      .d-line { display: flex; align-items: center; gap: 8px; font-size: 18px; }
      .d-line .pill { margin-left: 0; }
      .d-title { color: var(--muted); margin: 8px 0; overflow-wrap: anywhere; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .stat { background: var(--panel-2); box-shadow: var(--px); padding: 5px 9px; display: grid; min-width: 0; }
      .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
      .stat .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .current { display: flex; align-items: center; gap: 7px; padding: 6px 9px; margin: 6px 0 2px; background: #15241c; box-shadow: 0 0 0 2px #2b8a3e; min-width: 0; }
      .current span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .current.completed { background: var(--panel-2); box-shadow: var(--px); }
      .current.error { background: #2a1416; box-shadow: 0 0 0 2px #c92a2a; }
      h4 { margin: 16px 0 8px; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
      .bar { height: 8px; background: #0f0c17; box-shadow: 0 0 0 2px var(--line); margin-bottom: 8px; }
      .bar span { display: block; height: 100%; background: repeating-linear-gradient(90deg, #40c057 0 6px, #2f9e44 6px 8px); }
      .todo { display: flex; gap: 7px; padding: 2px 0; overflow-wrap: anywhere; }
      .todo .mark { width: 12px; flex: none; text-align: center; }
      .todo.completed { color: #8ce99a; opacity: 0.75; }
      .todo.completed span:last-child { text-decoration: line-through; }
      .todo.in_progress { color: #ffc078; }
      .f { display: grid; grid-template-columns: 34px 18px 1fr; gap: 6px; align-items: start; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
      .f .t { color: var(--muted); font-size: 11px; padding-top: 2px; }
      .f .x { overflow-wrap: anywhere; }
      .f.error .x { color: #ff8787; }
      .f.ask .x { color: #ffc078; }
      .f.think .x { color: #b197fc; font-style: italic; }
      .f.prompt .x { color: #a5d8ff; }
      .f.spawn .x { color: #fff3bf; }
      .muted { color: var(--muted); padding: 6px 14px; }
      @media (max-width: 860px) {
        body { overflow: auto; grid-template-rows: auto auto; }
        header { flex-wrap: wrap; padding: 8px 16px; }
        #rooms { order: 3; flex-basis: 100%; }
        main { grid-template-columns: 1fr; grid-template-rows: auto auto; }
        #stage { aspect-ratio: 8 / 5; max-height: 70vh; }
        aside { border-left: 0; border-top: 2px solid var(--line); }
        #agents { max-height: none; }
        #detail { overflow: visible; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PIXEL <span>OFFICE</span></h1>
      <nav id="rooms" aria-label="Sessions"></nav>
      <div class="opts">
        <label><input type="checkbox" id="follow" /> folgen</label>
        <label><input type="checkbox" id="show-all" /> alle</label>
        <span id="conn" class="conn" title="verbinde…"></span>
      </div>
    </header>
    <main>
      <div id="stage"><canvas id="office"></canvas></div>
      <aside>
        <div id="agents"></div>
        <div id="detail"></div>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
